<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="logoadmin.png">
  <link rel="apple-touch-icon" href="logoadmin.png">
<title>مدیریت کافه لامور ۲</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#faf5ee;--card:#fff;--tx:#2b1d14;--mut:#8a7766;--pri:#8b5a2b;--bd:#e8dccb;--ok:#2e7d4f;--warn:#c27a10;--bad:#b3392f;--blue:#2b6cb0;--sh:0 1px 2px rgba(60,40,20,.05),0 8px 20px rgba(60,40,20,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1511;--card:#2a201a;--tx:#f3e9dc;--mut:#a8957f;--pri:#d19a5c;--bd:#43352b;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25)}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:inherit;background:none;transition:transform .12s,opacity .12s}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--bg);box-shadow:0 2px 10px rgba(60,40,20,.05)}
header h1{font-size:1.05rem;flex:1}
.tab{padding:8px 14px;font-weight:600;color:var(--mut);position:relative;border:1px solid var(--bd);background:var(--card)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.badge{position:absolute;top:-6px;left:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px;font-style:normal}
a.lnk{color:var(--pri);font-weight:600;text-decoration:none;padding:8px;border-radius:10px}
a.lnk:hover{background:var(--bd)}
main{max-width:1100px;margin:auto;padding:14px}
.view{display:none}.view.on{display:block}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{white-space:nowrap;flex:0 0 auto;padding:7px 13px;background:var(--card);border:1px solid var(--bd);border-radius:99px;font-size:.9rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 8px;text-align:center;position:relative;cursor:pointer;user-select:none;box-shadow:var(--sh)}
.item:active{transform:scale(.96)}
.item b{display:block;font-size:.95rem}.item span{color:var(--mut);font-size:.8rem}
.item i{position:absolute;top:6px;right:6px;background:var(--pri);color:#fff;border-radius:99px;min-width:22px;height:22px;line-height:22px;font-size:.78rem;font-style:normal}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;position:sticky;top:64px;box-shadow:var(--sh)}
.panel h2{font-size:1rem;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.row .t{flex:1;font-size:.92rem}
.qb{display:flex;align-items:center;gap:6px}.qb button{width:32px;height:32px;background:var(--bd);font-weight:800}
input,textarea,select{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-top:8px}
textarea{resize:vertical;min-height:4rem}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:8px;border:1px solid var(--bd)}.seg .on{background:var(--pri);color:#fff}
.tot{display:flex;justify-content:space-between;font-weight:800;margin:12px 0}
.big{width:100%;padding:13px;background:var(--ok);color:#fff;font-weight:800}.big:disabled{opacity:.4}
.mut{color:var(--mut);font-size:.88rem}.empty{text-align:center;color:var(--mut);padding:30px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;box-shadow:var(--sh)}.stat b{display:block;color:var(--pri)}
.strip{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:.85rem;display:flex;gap:6px 14px;flex-wrap:wrap;box-shadow:var(--sh)}
.strip b{color:var(--pri)}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.oc{background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--blue);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.oc.s1{border-top-color:var(--warn)}.oc.s2{border-top-color:var(--ok)}.oc.s3{border-top-color:var(--mut)}
.oc.s3 ul,.oc.s3 .h{opacity:.7}
.oc .h{display:flex;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:6px}
.oc ul{list-style:none;padding:0;font-size:.93rem}
.note{background:var(--bg);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:.85rem}
.acts{display:flex;gap:6px;margin-top:10px}.acts .go{flex:1;padding:9px;background:var(--pri);color:#fff;font-weight:600}
.acts .ed,.acts .x{padding:9px 12px;background:var(--bd)}.acts .x{color:var(--bad)}
.pay{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
.pst{padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--bd)}
.pst.paid{background:rgba(46,125,79,.15);color:var(--ok)}
.pst.part{background:rgba(194,122,16,.16);color:var(--warn)}
.pst.none{background:rgba(179,57,47,.12);color:var(--bad)}
.pst.claim{background:rgba(43,108,176,.16);color:var(--blue)}
.pb{padding:6px 10px;border:1px solid var(--bd);border-radius:10px;font-size:.82rem;margin-inline-start:auto;background:var(--bg)}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ok);color:#fff;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
#mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#mdl[hidden]{display:none}
#mdl .box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:380px;display:grid;gap:8px;max-height:90vh;overflow-y:auto}
#mdl .box h3{font-size:1rem;margin-bottom:4px}
#mdl .op{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;text-align:right}
#mdl .op:active{transform:scale(.98)}
#mdl .x{color:var(--bad);background:var(--bd);padding:4px 9px}
#mdl select,#mdl input{margin-top:0}
.pbx{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd)}
.claim{background:rgba(43,108,176,.1);border:1px solid var(--blue);border-radius:10px;padding:10px;font-size:.88rem;display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:.9rem}
.prow>span{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.three .op{justify-content:center;padding:10px 4px;font-size:.85rem}
.club{margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd);display:grid;gap:0}
.club .ck{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:.85rem}
.club .ck[hidden]{display:none}
.club .ck input{width:auto;margin:0}
@media(max-width:800px){.grid2{grid-template-columns:1fr}.panel{position:static}.menu{grid-template-columns:repeat(2,1fr)}.qb button{width:38px;height:38px}}
</style>
</head>
<body>
<header>
  <h1>مدیریت کافه لامور ۲</h1>
  <button class="tab on" data-v="v2">📖 سفارش‌ها <i class="badge" id="bd" hidden>0</i></button>
  <button class="tab" data-v="v1">➕ ثبت سفارش (گارسون)</button>
  <a class="lnk" href="factor2.html">🧾 فاکتورها</a>
  <a class="lnk" href="club2.html">⭐ کلوپ</a>
  <a class="lnk" href="index2.html">🛎️ منوی مشتری</a>
</header>
<main>
  <section class="view on" id="v2">
    <div class="stats">
      <div class="stat"><b id="s1">۰</b><span class="mut">سفارش امروز</span></div>
      <div class="stat"><b id="s2">۰</b><span class="mut">در جریان</span></div>
      <div class="stat"><b id="s3">۰</b><span class="mut">فروش امروز (تومان)</span></div>
    </div>
    <div class="strip" id="pstrip"></div>
    <div class="cats" id="fl"></div>
    <div class="cats" id="fl2"></div>
    <div class="orders" id="ol"></div>
    <div style="margin-top:16px;text-align:center"><button class="chip" id="clr">🗑️ پاک‌کردن سفارش‌های تحویل‌شده از این صفحه</button></div>
    <p class="mut" style="text-align:center;margin-top:6px">فاکتورها با پاک‌کردن حذف نمی‌شوند و در صفحهٔ فاکتور می‌مانند.</p>
  </section>
  <section class="view" id="v1">
    <div class="grid2">
      <div><div class="cats" id="cats"></div><div class="menu" id="menu"></div></div>
      <div class="panel">
        <div id="eb" hidden class="mut" style="margin-bottom:6px"><span id="et"></span> <button data-ce style="color:var(--bad)">لغو ویرایش</button></div>
        <h2>سفارش سر میز</h2>
        <div id="cart"></div>
        <div class="seg" id="typ"><button class="on" data-t="میز">سالن</button><button data-t="بیرون‌بر">بیرون‌بر</button></div>
        <input id="tbl" type="text" inputmode="numeric" placeholder="شماره میز" />
        <textarea id="note" placeholder="توضیحات (مثلاً بدون شکر)"></textarea>
        <div class="club">
          <div class="mut">⭐ کلوپ مشتریان</div>
          <div class="mut" style="font-size:.78rem">🔒 شمارهٔ موبایل شما فقط برای کلوپ مشتریان و اطلاع‌رسانی کافه نگهداری می‌شود و به کسی داده نمی‌شود.</div>
          <input id="cph" type="text" inputmode="numeric" placeholder="شمارهٔ موبایل (اختیاری)" />
          <input id="cnm" type="text" placeholder="نام مشتری (اختیاری)" />
          <div class="mut" id="cinfo" style="margin-top:6px"></div>
          <label class="ck" id="cconw" hidden><input type="checkbox" id="ccon"> مشتری پیام بالا را دید و موافق است</label>
          <label class="ck" id="cusew" hidden><input type="checkbox" id="cuse"> <span id="cusel"></span></label>
        </div>
        <div class="mut" id="cdisc" style="margin-top:8px"></div>
        <div class="tot"><span>جمع کل</span><span id="sum">۰</span></div>
        <button class="big" id="sub" disabled>ثبت سفارش ✓</button>
      </div>
    </div>
  </section>
</main>
<div id="mdl" hidden><div class="box" id="mbox"></div></div>
<div id="toast" role="status"></div>
<script src="sheet-db.js" data-auth="1" data-prefix="l2_" data-menu="Menu2"></script>
<script>DB.ready.then(()=>{
let MENU=[["سینگل","قهوه",140],["دبل","قهوه",160],["ترک","قهوه",160],["آمریکانو","گرم",180],["آیس آمریکانو","سرد",190],["لاته","گرم",210],["آیس لاته","سرد",230],["هات چاکلت","گرم",240],["آلفردو","غذا",490],["پیتزا","غذا",600],["املت","غذا",270],["ایرانی","غذا",600],["نیمرو","غذا",200],["سوسیس تخم مرغ","غذا",270],["قیساوا","غذا",270],["سجوک","غذا",290],["موکا","گرم",230],["ماکیاتو","گرم",230],["آیس ماکیاتو","سرد",250],["چای ماسالا","گرم",230],["وایت چاکلت","گرم",240],["کاپوچینو","گرم",240],["آیس موکا","سرد",250],["آفوگاتو","سرد",360],["چای ویژه","چایی",250],["فنجانی","چایی",70],["دمنوش زنجبیل","چایی",250],["دمنوش لیمو نعناع","چایی",250],["سرماخوردگی","چایی",250],["گل گاوزبان","چایی",250],["دمنوش میوه","چایی",290],["شکلاتی","شیک",470],["نوتلا","شیک",470],["موز","شیک",420],["بادام زمینی","شیک",420],["نسکافه","شیک",400],["کیک خیس","خوراکی",250],["باقلوا","خوراکی",50],["پستو","غذا",620],["مکن چیز","غذا",400],["آب","نوشیدنی",25]].map((m,i)=>({n:m[0],c:m[1],p:m[2],id:i}));
let CATS=["همه",...new Set(MENU.map(m=>m.c))];
if(DB.menu){MENU=DB.menu.map((m,i)=>({...m,id:i}));CATS=["همه",...new Set(MENU.map(m=>m.c))]}

/* گزینه‌های آیتم‌هایی که چند حالت دارند (بر اساس نام آیتم) */
const OPTS={
  "ترک":{t:"قهوه ترک را چطور می‌خواهید؟",l:[{l:"تلخ",p:160},{l:"مدیوم",p:160},{l:"شیرین",p:160}]},
  "سینگل":{t:"ترکیب قهوه (سینگل)",l:[{l:"۱۰۰٪ روبوستا",p:140},{l:"۷۰٪ روبوستا + ۳۰٪ عربیکا",p:160},{l:"۵۰٪ روبوستا + ۵۰٪ عربیکا",p:180},{l:"۳۰٪ روبوستا + ۷۰٪ عربیکا",p:200},{l:"۱۰۰٪ عربیکا",p:250}]},
  "دبل":{t:"ترکیب قهوه (دبل)",l:[{l:"۱۰۰٪ روبوستا",p:160},{l:"۷۰٪ روبوستا + ۳۰٪ عربیکا",p:180},{l:"۵۰٪ روبوستا + ۵۰٪ عربیکا",p:200},{l:"۳۰٪ روبوستا + ۷۰٪ عربیکا",p:250},{l:"۱۰۰٪ عربیکا",p:280}]}
};
const hasOpt=m=>!!(m&&Object.prototype.hasOwnProperty.call(OPTS,m.n));

const ST=["جدید","در حال آماده‌سازی","آماده تحویل","تحویل داده شد"],NX=["شروع آماده‌سازی","آماده شد","تحویل داده شد ✓"];
const NTFY="https://ntfy.sh/lamour2-5b7e91c3a8d04f6e2a19";
const K="cafe_orders_v1",A="cafe_invoices_v1",SEEN="cafe_seen_v1",CNT="cafe_no_v1",PYK="cafe_pay_v1",WK="cafe_inv_person_v1";
const TZ="Asia/Tehran";
const irDate=t=>new Date(t).toLocaleDateString("fa-IR-u-ca-persian",{timeZone:TZ,year:"numeric",month:"long",day:"numeric"});
const irTime=t=>new Date(t).toLocaleTimeString("fa-IR",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
const irDay=t=>new Date(t).toLocaleDateString("en-CA",{timeZone:TZ});
const $=s=>document.querySelector(s),fa=n=>Number(n).toLocaleString("fa-IR");
const esc=s=>String(s==null?"":s).replace(/[<>&"]/g,"");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ld=k=>{try{return JSON.parse(DB.get(k))||[]}catch(e){return[]}};
const ldo=k=>{try{return JSON.parse(DB.get(k))||{}}catch(e){return{}}};
const sv=(k,v)=>{try{DB.set(k,JSON.stringify(v))}catch(e){}};
let cart={},cat="همه",typ="میز",flt=-1,flt2="",editing=null,payId=null;

/* ---------- پرداخت و تسویه ---------- */
const MN={cash:"نقدی",pos:"کارتخوان",c2c:"کارت به کارت",unk:"نامشخص (قبلی)"},MI={cash:"💵",pos:"💳",c2c:"🏦",unk:"❔"};
const getPY=()=>ldo(PYK),setPY=v=>sv(PYK,v);
function payInfo(o,PY){
  const e=PY[o.id]||{},ps=e.ps||[],paid=ps.reduce((s,x)=>s+(+x.a||0),0),sum=o.sum||0,by={};
  ps.forEach(x=>by[x.m]=(by[x.m]||0)+(+x.a||0));
  return{e,ps,paid,rem:Math.max(0,sum-paid),by,st:paid<=0?"none":paid>=sum?"paid":"part",cl:e.cl&&e.cl.st=="p"?e.cl:null};
}
const bySum=by=>Object.keys(by).map(k=>(MI[k]||"")+" "+(MN[k]||k)+" "+fa(by[k])).join(" + ");
const claimTxt=c=>c.pl.map(x=>(MI[x.m]||"")+" "+(MN[x.m]||x.m)+" "+fa(x.a)+(x.m=="c2c"?"":" (در کافه)")).join(" + ");
function payBox(o,PY){
  const f=payInfo(o,PY),e=f.e;
  const t=f.st=="paid"?"✅ تسویه شد":f.st=="part"?"🟡 نیمه‌پرداخت ("+fa(f.paid)+" از "+fa(o.sum)+")":"⏳ تسویه نشده";
  let h=`<div class="pay"><span class="pst ${f.st}">${t}</span>`;
  if(f.paid)h+=`<span class="mut">${bySum(f.by)}</span>`;
  if(f.cl)h+=`<span class="pst claim">🔔 رسید مشتری در انتظار تأیید</span>`;
  else if(e.cl&&e.cl.st=="info")h+=`<span class="mut">🧾 مشتری: ${claimTxt(e.cl)}</span>`;
  return h+`<button class="pb" data-pay="${o.id}">💰 پرداخت</button></div>`;
}
function openPay(id){
  const o=ld(K).find(r=>r.id==id);if(!o)return;payId=id;
  const PY=getPY(),f=payInfo(o,PY),c=f.cl,e=f.e;
  let h=`<h3>💰 پرداخت سفارش #${fa(o.no||0)}</h3><div class="pbx"><span>جمع سفارش</span><b>${fa(o.sum)}</b></div><div class="pbx"><span>دریافت‌شده</span><b style="color:var(--ok)">${fa(f.paid)}</b></div><div class="pbx"><span>مانده</span><b style="color:${f.rem?"var(--bad)":"var(--ok)"}">${fa(f.rem)}</b></div>`;
  if(c)h+=`<div class="claim">🔔 اعلام مشتری: ${claimTxt(c)}${c.ref?`<br>شمارهٔ پیگیری: ${esc(c.ref)}`:""}${c.last4?`<br>۴ رقم آخر کارت: ${esc(c.last4)}`:""}<span class="mut">پس از چک کردن واریز در اپ بانک، تأیید کن. فقط بخش «کارت به کارت» ثبت می‌شود.</span><div class="two"><button class="op" data-pok style="justify-content:center">✔ تأیید رسید</button><button class="op" data-pno style="justify-content:center">✖ رد</button></div></div>`;
  else if(e.cl&&e.cl.st=="info")h+=`<div class="claim">🧾 روش انتخابی مشتری: ${claimTxt(e.cl)}</div>`;
  if(f.ps.length)h+=f.ps.map((x,i)=>`<div class="prow"><span>${MI[x.m]||""} ${MN[x.m]||x.m}${x.r?` · پیگیری ${esc(x.r)}`:""}${x.v?" ✔":""}<br><span class="mut">${irDate(x.t)} · ${irTime(x.t)}</span></span><b>${fa(x.a)}</b><button class="x" data-pdel="${i}">✕</button></div>`).join("");
  if(f.rem>0)h+=`<div class="mut">تسویهٔ کامل مانده (${fa(f.rem)}) با:</div><div class="three"><button class="op" data-pq="cash">💵 نقدی</button><button class="op" data-pq="pos">💳 کارتخوان</button><button class="op" data-pq="c2c">🏦 کارت‌به‌کارت</button></div>`;

(function renumber(){
  const F="cafe_no_reset_v2";let done=null;try{done=DB.get(F)}catch(e){}
  if(done)return;
  const ord=ld(K),inv=ld(A),seen=new Map();
  ord.concat(inv).forEach(o=>{if(o&&o.id&&!seen.has(o.id))seen.set(o.id,o.t)});
  const byDay={},num=new Map();
  [...seen.entries()].sort((a,b)=>a[1]-b[1]).forEach(([id,t])=>{const d=irDay(t);byDay[d]=(byDay[d]||0)+1;num.set(id,byDay[d])});
  ord.forEach(o=>{if(num.has(o.id))o.no=num.get(o.id)});
  inv.forEach(o=>{if(num.has(o.id))o.no=num.get(o.id)});
  sv(K,ord);sv(A,inv);

/* اعتبارسنجی سفارش مشتری: قیمت‌ها و جمع کل همیشه از منوی خود ادمین محاسبه می‌شوند،
   نه از چیزی که در پیام آمده (پیام ntfy را هر کسی می‌تواند بسازد) */
function sanitize(o){
  if(!o||!Array.isArray(o.items)||!o.items.length||o.items.length>40)return null;
  const id=String(o.id||"").replace(/[^a-z0-9]/gi,"").slice(0,24);
  if(!id)return null;
  const items=[];
  for(const i of o.items){
    const m=MENU[+i.id],q=Math.floor(+i.q);
    if(!m||!(q>0&&q<=50))return null;
    let p=m.p,n=m.n,x;
    if(i.o!==undefined&&hasOpt(m)){
      const op=OPTS[m.n].l[+i.o];if(!op)return null;
      p=op.p;n=m.n+" ("+op.l+")";x=+i.o;
    }
    const it={id:m.id,n,q,p};if(x!==undefined)it.o=x;items.push(it);
  }
  const typ=o.typ=="میز"?"میز":"بیرون‌بر";
  const sum=items.reduce((a,i)=>a+i.p*i.q,0);
  const t=Math.abs(Date.now()-(+o.t||0))<864e5?+o.t:Date.now();
  const pay=o.pay&&Array.isArray(o.pay.pl)?{pl:o.pay.pl.slice(0,3),ref:o.pay.ref,last4:o.pay.last4}:undefined;
  return{id,t,typ,tbl:typ=="میز"?esc(o.tbl).slice(0,10):"",note:esc(o.note).slice(0,300),items,sum,pay,ph:normPh(o.ph),cn:o.cn?1:0,cnm:esc(o.cnm).slice(0,40),ruse:o.ruse?1:0};
}

function clubLoad(x){$("#cph").value=x.ph||"";$("#cnm").value=x.cnm||"";$("#ccon").checked=!!x.cn;$("#cuse").checked=!!x.rp}
function clubReset(){$("#cph").value="";$("#cnm").value="";$("#ccon").checked=false;$("#cuse").checked=false;CQ=null}
/* بعد از «تحویل داده شد»: امتیاز و تخفیف در سرور نهایی می‌شود (هر سفارش فقط یک‌بار) */
async function clubSettle(id){
  const o=ld(K).find(r=>r.id==id);if(!o||!o.ph||o.cs||o.s!=3)return;
  try{
    const r=await DB.club({action:"clubSettle",consent:!!o.cn,order:{id:o.id,ph:o.ph,gross:o.gross||o.sum,want:o.rp||0,name:o.cnm||""}});
    if(!r||!r.ok)throw 0;
    const all=ld(K),x=all.find(q=>q.id==id);if(!x)return;
    x.cs=1;x.ep=r.earn;
    const diff=r.dl!==x.dl||r.dp!==x.dp;
    if(diff){x.dl=r.dl;x.dp=r.dp;x.rp=r.pts;x.sum=r.net}
    sv(K,all);if(diff)reinvoice(x);
    renderOrders();toast(diff?"⚠️ تخفیف کلوپ با موجودی فعلی اصلاح شد":"⭐ "+fa(r.earn)+" امتیاز ثبت شد",diff);
  }catch(e){toast("ثبت امتیاز انجام نشد؛ دکمهٔ «ثبت امتیاز» را بزن",true);renderOrders()}
}
$("#cph").addEventListener("input",clubSync);
$("#cuse").addEventListener("change",clubQuote);

async function clubIncoming(id){
  const o=ld(K).find(r=>r.id==id);if(!o||!o.ph||o.gross)return;
  let r=null;try{r=await DB.club({action:"clubQuote",phone:o.ph,gross:o.sum,want:0})}catch(e){}
  const all=ld(K),x=all.find(q=>q.id==id);if(!x)return;
  x.gross=x.sum;x.dp=0;x.rp=0;x.cs=0;
  if(r&&r.ok){x.dl=r.q.dl;x.lv=r.q.lv;x.sum=x.gross-x.dl}else x.dl=0;
  sv(K,all);renderOrders();
}
/* تأیید یا ردِ «درخواست استفاده از امتیاز» مشتری (فقط با تأیید گارسون اعمال می‌شود) */
async function clubApprove(id,ok){
  const all=ld(K),x=all.find(r=>r.id==id);if(!x)return;
  if(ok){
    let r=null;try{r=await DB.club({action:"clubQuote",phone:x.ph,gross:x.gross||x.sum,want:1e9})}catch(e){}
    if(!r||!r.ok){toast("ارتباط با کلوپ برقرار نیست",true);return}
    const y=ld(K).find(q=>q.id==id);if(!y)return;
    if(r.q.pts>0){y.dl=r.q.dl;y.dp=r.q.dp;y.rp=r.q.pts;y.sum=(y.gross||y.sum)-y.dl-y.dp;toast("✓ تخفیف امتیاز اعمال شد")}
    else toast("امتیاز قابل استفاده‌ای نیست",true);
    y.ruse=0;sv(K,ld(K).map(q=>q.id==id?y:q));
  }else{x.ruse=0;sv(K,all)}
  renderOrders();
}
const clubLine=o=>!o.ph?"":`<div class="pay"><span class="pst ${o.cs?"paid":"none"}">⭐ ${esc(o.ph)}</span>${(o.dl||0)+(o.dp||0)?`<span class="mut">تخفیف کلوپ ${fa((o.dl||0)+(o.dp||0))}</span>`:""}${o.cs?`<span class="mut">+${fa(o.ep||0)} امتیاز</span>`:o.s==3?`<button class="pb" data-cretry="${o.id}">🔄 ثبت امتیاز</button>`:`<span class="mut">پس از تحویل ثبت می‌شود</span>`}${o.ruse&&!o.cs?`<span class="pst claim">🔔 مشتری می‌خواهد امتیاز مصرف کند</span><button class="pb" data-capp="${o.id}">✔ تأیید</button><button class="pb" data-crej="${o.id}">✖ رد</button>`:""}</div>`;


$("#sub").onclick=async()=>{
  const ids=Object.keys(cart);if(!ids.length)return;
  const tbl=$("#tbl").value.trim();
  if(typ=="میز"&&!tbl){alert("لطفاً شماره میز را وارد کنید");$("#tbl").focus();return}
  const items=ids.map(k=>{const r=parse(k);return{id:r.id,o:r.o,n:r.n,q:cart[k],p:r.p}});
  const gross=items.reduce((a,i)=>a+i.p*i.q,0),note=$("#note").value.trim();
  const cf=await clubFields(gross);if(cf===false)return;
  const sum=gross-cf.dl-cf.dp;
  if(editing){const ox=ld(K).find(r=>r.id==editing);if(ox&&ox.cs){const rr=await clubReverseP(ox.id);if(!rr||!rr.ok){alert("لغو امتیاز قبلی انجام نشد؛ دوباره تلاش کن");return}}}
  if(editing){
    const all=ld(K),x=all.find(r=>r.id==editing);
    if(x){Object.assign(x,{typ,tbl:typ=="میز"?tbl:"",note,items,sum},cf,{cs:0});sv(K,all);if(x.s==3){reinvoice(x);clubSettle(x.id)}}
    toast("✓ تغییرات ذخیره شد");
  }else{
    addOrder({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now(),typ,tbl:typ=="میز"?tbl:"",note,items,sum,by:"waiter",...cf,cs:0});
    toast("✓ سفارش ثبت شد");
  }
  resetForm();renderCart();renderOrders();
};
$("#clr").onclick=()=>{if(confirm("سفارش‌های تحویل‌شده از این صفحه پاک شوند؟ (فاکتورها حفظ می‌شوند)")){const all=ld(K);all.filter(o=>o.s==3).forEach(archive);sv(K,all.filter(o=>o.s<3));renderOrders()}};
addEventListener("storage",e=>{if(e.key==K||e.key==PYK)renderOrders()});
setInterval(()=>{if($("#mdl").hidden)renderOrders()},30000);
renderCats();renderCart();renderOrders();
});</script>
