<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>پنل سفارش‌ها - کافه لامور</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #faf5ee; --card: #fff; --tx: #2b1d14; --mut: #8a7766;
        --pri: #8b5a2b; --bd: #e8dccb; --ok: #2e7d4f; --warn: #c27a10;
        --bad: #b3392f; --blue: #2b6cb0;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1c1511; --card: #2a201a; --tx: #f3e9dc; --mut: #a8957f;
          --pri: #d19a5c; --bd: #43352b;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body { background: var(--bg); color: var(--tx); font-family: Vazirmatn, Tahoma, sans-serif; overflow-x: hidden; }
      button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; color: inherit; background: none; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--bd); }
      header h1 { font-size: 1.1rem; font-weight: 800; }
      .hd { display: flex; align-items: center; gap: 8px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); display: inline-block; }
      .dot.on { background: var(--ok); }
      .snd { padding: 7px 12px; border: 1px solid var(--bd); background: var(--card); font-size: 0.85rem; }
      .snd.on { background: var(--pri); color: #fff; border-color: var(--pri); }
      main { max-width: 1100px; margin: auto; padding: 14px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
      .stat { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 10px; text-align: center; }
      .stat b { display: block; font-size: 1.15rem; color: var(--pri); }
      .mut { color: var(--mut); font-size: 0.88rem; }
      .cats { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); scrollbar-width: none; }
      .cats::-webkit-scrollbar { display: none; }
      .chip { white-space: nowrap; flex: 0 0 auto; padding: 7px 13px; background: var(--card); border: 1px solid var(--bd); border-radius: 99px; font-size: 0.9rem; }
      .chip.on { background: var(--pri); color: #fff; border-color: var(--pri); }
      .orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 6px; }
      .oc { background: var(--card); border: 1px solid var(--bd); border-top: 5px solid var(--blue); border-radius: 14px; padding: 12px; min-width: 0; }
      .oc.s1 { border-top-color: var(--warn); }
      .oc.s2 { border-top-color: var(--ok); }
      .oc.s3 { border-top-color: var(--mut); opacity: 0.7; }
      .oc.fresh { animation: pop 1.2s ease 2; }
      @keyframes pop { 50% { box-shadow: 0 0 0 4px var(--blue); } }
      .oc .h { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 6px; }
      .oc ul { list-style: none; padding: 0; font-size: 0.93rem; }
      .oc .note { background: var(--bg); border-radius: 8px; padding: 6px 8px; margin-top: 6px; font-size: 0.85rem; overflow-wrap: anywhere; }
      .acts { display: flex; gap: 6px; margin-top: 10px; }
      .acts .go { flex: 1; padding: 10px; background: var(--pri); color: #fff; font-weight: 600; }
      .acts .x { padding: 10px 14px; background: var(--bd); color: var(--bad); }
      .empty { text-align: center; color: var(--mut); padding: 40px 0; grid-column: 1 / -1; }
      @media (max-width: 800px) {
        main { padding: 10px; }
        .orders { grid-template-columns: minmax(0, 1fr); }
        .stat b { font-size: 0.95rem; }
        .stat .mut { font-size: 0.75rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📖 سفارش‌های کافه لامور</h1>
      <div class="hd">
        <span class="dot" id="dot" title="وضعیت اتصال"></span>
        <button class="snd" id="snd">🔔 فعال‌سازی صدا</button>
      </div>
    </header>
    <main>
      <div class="stats">
        <div class="stat"><b id="s1">۰</b><span class="mut">سفارش امروز</span></div>
        <div class="stat"><b id="s2">۰</b><span class="mut">در جریان</span></div>
        <div class="stat"><b id="s3">۰</b><span class="mut">فروش (تومان)</span></div>
      </div>
      <div class="cats" id="fl"></div>
      <div class="orders" id="ol"></div>
      <div style="margin-top:16px;text-align:center">
        <button class="chip" id="clr">🗑️ پاک‌ کردن سفارش‌ های تحویل‌ داده شده</button>
      </div>
    </main>
    <script>
      // باید دقیقاً با TOPIC در index.html یکی باشد
      const TOPIC = "lamour-ce97ecdd2624b89c6b5d";
      const K = "lamour_admin_orders_v1", KT = "lamour_admin_last_v1";
      const ST = ["جدید", "در حال آماده‌سازی", "آماده تحویل", "تحویل داده شد"];
      const NX = ["شروع آماده‌سازی", "آماده شد", "تحویل داده شد ✓"];
      const $ = (s) => document.querySelector(s);
      const fa = (n) => Number(n || 0).toLocaleString("fa-IR");
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      let orders = [], flt = -1, lastT = +localStorage.getItem(KT) || 0, fresh = new Set();
      try { orders = JSON.parse(localStorage.getItem(K)) || []; } catch (e) {}
      const save = () => { try { localStorage.setItem(K, JSON.stringify(orders)); } catch (e) {} };

      // ---------- صدا ----------
      let ctx = null, soundOn = false;
      $("#snd").onclick = () => {
        soundOn = !soundOn;
        $("#snd").classList.toggle("on", soundOn);
        $("#snd").textContent = soundOn ? "🔔 صدا روشن" : "🔔 فعال‌سازی صدا";
        if (soundOn) { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); beep(); }
      };
      function beep() {
        if (!soundOn || !ctx) return;
        [0, 0.18].forEach((d) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0.2, ctx.currentTime + d);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 0.15);
          o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.16);
        });
        try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
      }

      // ---------- دریافت سفارش ----------
      function addOrder(o) {
        if (!o || typeof o.id !== "string" || !Array.isArray(o.items)) return false;
        if (orders.some((x) => x.id == o.id)) return false;
        const items = o.items.slice(0, 60).map((i) => ({ n: String(i.n || "").slice(0, 60), q: Math.max(1, Math.floor(+i.q || 1)), p: +i.p || 0 }));
        const t = +o.t || Date.now();
        const day = new Date(t).toDateString();
        const no = 1 + Math.max(0, ...orders.filter((x) => new Date(x.t).toDateString() == day).map((x) => x.no));
        orders.push({
          id: o.id, no, t, s: 0,
          typ: o.typ == "میز" ? "میز" : "بیرون‌بر",
          tbl: String(o.tbl || "").slice(0, 20),
          note: String(o.note || "").slice(0, 300),
          items, sum: items.reduce((a, i) => a + i.p * i.q, 0),
        });
        fresh.add(o.id);
        save();
        return true;
      }

      let es = null;
      function connect() {
        if (es) es.close();
        es = new EventSource("https://ntfy.sh/" + TOPIC + "/sse?since=" + (lastT || "12h"));
        es.onopen = () => $("#dot").classList.add("on");
        es.onmessage = (ev) => {
          let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
          if (d.event != "message") return;
          if (d.time) { lastT = Math.max(lastT, d.time); localStorage.setItem(KT, lastT); }
          let o; try { o = JSON.parse(d.message); } catch (e) { return; }
          if (addOrder(o)) { beep(); render(); }
        };
        es.onerror = () => {
          $("#dot").classList.remove("on");
          es.close();
          setTimeout(connect, 3000);
        };
      }

      // ---------- نمایش ----------
      function render() {
        const today = new Date().toDateString();
        const td = orders.filter((o) => new Date(o.t).toDateString() == today);
        $("#s1").textContent = fa(td.length);
        $("#s2").textContent = fa(orders.filter((o) => o.s < 3).length);
        $("#s3").textContent = fa(td.filter((o) => o.s == 3).reduce((a, o) => a + o.sum, 0));
        const nw = orders.filter((o) => o.s == 0).length;
        document.title = (nw ? "(" + nw + ") " : "") + "پنل سفارش‌ها - کافه لامور";
        $("#fl").innerHTML = ["همه", ...ST].map((s, i) => `<button class="chip ${flt == i - 1 ? "on" : ""}" data-f="${i - 1}">${s}</button>`).join("");
        const list = orders.filter((o) => flt < 0 || o.s == flt).sort((a, b) => (a.s == 3) - (b.s == 3) || a.t - b.t);
        $("#ol").innerHTML = list.length ? list.map((o) =>
          `<div class="oc s${o.s} ${fresh.has(o.id) ? "fresh" : ""}"><div class="h"><span>#${fa(o.no)} · ${o.typ == "میز" ? "میز " + (esc(o.tbl) || "؟") : "بیرون‌بر"}</span><span class="mut">${new Date(o.t).toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" })}</span></div><ul>${o.items.map((i) => `<li>${fa(i.q)} × ${esc(i.n)}</li>`).join("")}</ul>${o.note ? `<div class="note">${esc(o.note)}</div>` : ""}<div class="mut" style="margin-top:6px">${ST[o.s]} · ${fa(o.sum)} تومان</div><div class="acts">${o.s < 3 ? `<button class="go" data-adv="${esc(o.id)}">${NX[o.s]}</button>` : ""}<button class="x" data-del="${esc(o.id)}">✕</button></div></div>`
        ).join("") : '<div class="empty">سفارشی وجود ندارد</div>';
        fresh.clear();
      }

      document.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.f !== undefined) { flt = +b.dataset.f; render(); }
        else if (b.dataset.adv) { const x = orders.find((r) => r.id == b.dataset.adv); if (x && x.s < 3) x.s++; save(); render(); }
        else if (b.dataset.del) { if (confirm("این سفارش حذف شود؟")) { orders = orders.filter((r) => r.id != b.dataset.del); save(); render(); } }
      });
      $("#clr").onclick = () => {
        if (confirm("همه سفارش‌های تحویل‌شده پاک شوند؟")) { orders = orders.filter((o) => o.s < 3); save(); render(); }
      };
      setInterval(render, 60000);
      render();
      connect();
    </script>
  </body>
</html>
