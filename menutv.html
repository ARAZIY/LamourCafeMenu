<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b110c" />
    <title>L`amour</title>
    <link rel="apple-touch-icon" href="./logolamour.png" />
    <link rel="icon" type="image/png" href="./logolamour.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #1b110c;
        --bg2: #2a1a11;
        --card: rgba(255, 236, 209, 0.045);
        --line: rgba(222, 166, 96, 0.28);
        --tx: #f7e8d0;
        --mut: #a89078;
        --gold: #e0a860;
        --rose: #d98b7c;
        --fs: 20px; /* توسط جاوااسکریپت تنظیم می‌شود */
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden; /* بدون اسکرول؛ همه‌چیز در یک صفحه */
      }
      body {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        color: var(--tx);
        font-family: Vazirmatn, Tahoma, sans-serif;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background:
          radial-gradient(60vw 45vh at 8% 0%, rgba(217, 139, 124, 0.16), transparent 70%),
          radial-gradient(55vw 50vh at 95% 100%, rgba(224, 168, 96, 0.14), transparent 70%),
          linear-gradient(160deg, var(--bg2), var(--bg) 60%);
      }

      /* ---------- سربرگ ---------- */
      header {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2vw;
        padding: 1.4vh 3vw 0.4vh;
        animation: rise 0.9s ease both;
      }
      header::before,
      header::after {
        content: "";
        flex: 1;
        height: 1px;
        max-width: 28vw;
        background: linear-gradient(90deg, transparent, var(--gold));
      }
      header::after {
        transform: scaleX(-1);
      }
      .brand {
        display: grid;
        justify-items:center;
        align-items: center;
        gap: 1.2vw;
      }
      .brand img {
        height: clamp(32px, 7vh, 80px);
        width: 50%;
        border-radius: 50%;
        box-shadow: 0 0 0 2px var(--line);
      }
      .brand h1 {
        font-family: Lalezar, Vazirmatn, sans-serif;
        font-weight: 400;
        font-size: clamp(22px, 5vh, 56px);
        line-height: 1.1;
        color: var(--gold);
        letter-spacing: 0.02em;
      }
      .brand small {
        display: block;
        font-size: clamp(9px, 1.6vh, 16px);
        color: var(--mut);
        margin-top: 0.15em;
      }

      /* ---------- بدنهٔ منو ---------- */
      #board {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        gap: 1vw;
        padding: 1vh 1.4vw 1.4vh;
        overflow: hidden;
        font-size: var(--fs);
        animation: rise 1.1s 0.15s ease both;
      }
      .col {
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 0.6em;
      }
      .cat {
        flex: none;
        padding: 0.35em 0.8em 0.45em;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1.1em;
        box-shadow: inset 0 1px 0 rgba(255, 236, 209, 0.06);
      }
      .cat h2 {
        display: flex;
        align-items: center;
        gap: 0.6em;
        font-family: Lalezar, Vazirmatn, sans-serif;
        font-weight: 400;
        font-size: 1.2em;
        line-height: 1.5;
        color: var(--gold);
        margin-bottom: 0.1em;
      }
      .cat h2::before,
      .cat h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .cat h2 span::before {
        content: "✦";
        color: var(--rose);
        font-size: 0.55em;
        margin-inline-end: 0.6em;
        vertical-align: 0.2em;
      }
      .it {
        display: flex;
        align-items: baseline;
        gap: 0.5em;
        padding: 0.16em 0.1em;
        line-height: 1.35;
      }
      .it .nm {
        font-weight: 600;
        font-size: 0.95em;
        white-space: nowrap;
      }
      .it .dots {
        flex: 1;
        min-width: 1em;
        border-bottom: 1.5px dotted var(--mut);
        transform: translateY(-0.25em);
        opacity: 0.45;
      }
      .it .pr {
        font-weight: 800;
        color: var(--gold);
        font-size: 0.95em;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(1.5vh); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        header, #board { animation: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="./logolamour.png" alt="" onerror="this.remove()" />
        <div>
          <h1>L`amour</h1>
        </div>
      </div>
    </header>

    <main id="board"></main>

    <script>
      /* ---------- منو: فقط از همین لیست خوانده می‌شود (بدون دیتابیس) ---------- */
      const MENU = [
        { n: "سینگل", c: "قهوه", p: 140 },
        { n: "دبل", c: "قهوه", p: 160 },
        { n: "ترک", c: "قهوه", p: 160 },
        { n: "آمریکانو", c: "بار گرم", p: 180 },
        { n: "آیس آمریکانو", c: "بار سرد", p: 190 },
        { n: "لاته", c: "بار گرم", p: 210 },
        { n: "آیس لاته", c: "بار سرد", p: 230 },
        { n: "هات چاکلت", c: "بار گرم", p: 240 },
        { n: "موکا", c: "بار گرم", p: 230 },
        { n: "ماکیاتو", c: "بار گرم", p: 230 },
        { n: "آیس ماکیاتو", c: "بار سرد", p: 250 },
        { n: "چای ماسالا", c: "بار گرم", p: 230 },
        { n: "وایت چاکلت", c: "بار گرم", p: 240 },
        { n: "کاپوچینو", c: "بار گرم", p: 240 },
        { n: "آیس موکا", c: "بار سرد", p: 250 },
        { n: "آفوگاتو", c: "بار سرد", p: 360 },
        { n: "چای ویژه", c: "چایی", p: 250 },
        { n: "فنجانی", c: "چایی", p: 70 },
        { n: "دمنوش زنجبیل", c: "چایی", p: 250 },
        { n: "دمنوش لیمو نعناع", c: "چایی", p: 250 },
        { n: "سرماخوردگی", c: "چایی", p: 250 },
        { n: "گل گاوزبان", c: "چایی", p: 250 },
        { n: "دمنوش میوه", c: "چایی", p: 290 },
        { n: "شکلاتی", c: "شیک", p: 470 },
        { n: "نوتلا", c: "شیک", p: 470 },
        { n: "موز", c: "شیک", p: 420 },
        { n: "بادام زمینی", c: "شیک", p: 420 },
        { n: "نسکافه", c: "شیک", p: 400 },
        { n: "کیک خیس", c: "خوراکی", p: 250 },
        { n: "باقلوا", c: "خوراکی", p: 50 },
        { n: "آب", c: "نوشیدنی", p: 25 },
        { n: "آب آلبالو", c: "نوشیدنی", p: 120 },
        { n: "آبلوبری", c: "نوشیدنی", p: 120 },
        { n: "دراگون فروت", c: "نوشیدنی", p: 150 },
        { n: "آناناس", c: "نوشیدنی", p: 85 },
        { n: "شاهتوت سیاه", c: "نوشیدنی", p: 150 },
        { n: "هلو", c: "نوشیدنی", p: 85 },
        { n: "انرژی زا کوچک", c: "نوشیدنی", p: 130 },
        { n: "انرژی زا بزرگ", c: "نوشیدنی", p: 150 },
        { n: "لیموناد", c: "نوشیدنی", p: 85 },
        { n: "آب هویج", c: "بار موکتل", p: 200 },
        { n: "آب انار", c: "بار موکتل", p: 250 },
        { n: "آب سیب", c: "بار موکتل", p: 200 },
        { n: "آب پرتقال", c: "بار موکتل", p: 290 },
        { n: "شیر موز", c: "بار موکتل", p: 290 },
        { n: "آب طالبی", c: "بار موکتل", p: 290 },
        { n: "اسکوپ بستنی", c: "بار موکتل", p: 70 },
      ];

      /* ترتیب نمایش دسته‌ها (دسته‌های ناشناخته آخر می‌آیند) */
      const ORDER = ["قهوه", "بار گرم", "بار سرد", "چایی", "شیک", "بار موکتل", "نوشیدنی", "خوراکی"];

      const $ = (s) => document.querySelector(s);
      const fa = (n) => Number(n).toLocaleString("fa-IR");
      const esc = (s) => String(s == null ? "" : s).replace(/[<>&"]/g, "").trim();

      const GROUPS = (() => {
        const g = [];
        MENU.forEach((m) => {
          const c = esc(m.c);
          let x = g.find((y) => y.c == c);
          if (!x) g.push((x = { c, items: [] }));
          x.items.push(m);
        });
        const rank = (c) => { const i = ORDER.indexOf(c); return i < 0 ? 99 : i; };
        g.sort((a, b) => rank(a.c) - rank(b.c));
        g.forEach((x) => x.items.sort((a, b) => a.p - b.p)); /* ارزان به گران */
        return g;
      })();

      /* تقسیم دسته‌ها به n ستونِ پشت‌سرهم با کمترین اختلاف ارتفاع */
      function split(n) {
        const w = GROUPS.map((g) => g.items.length * 10 + 22);
        const cnt = (max) => {
          let c = 1, cur = 0;
          w.forEach((x) => {
            if (cur + x > max) { c++; cur = 0; }
            cur += x;
          });
          return c;
        };
        let lo = Math.max(...w), hi = w.reduce((a, b) => a + b, 0);
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (cnt(mid) <= n) hi = mid; else lo = mid + 1;
        }
        const cols = [[]];
        let cur = 0;
        GROUPS.forEach((g, i) => {
          if (cur + w[i] > lo && cols[cols.length - 1].length) {
            cols.push([]);
            cur = 0;
          }
          cols[cols.length - 1].push(g);
          cur += w[i];
        });
        return cols;
      }

      function build(n) {
        $("#board").innerHTML = split(n)
          .map(
            (col) =>
              `<div class="col">${col
                .map(
                  (g) =>
                    `<section class="cat"><h2><span>${g.c}</span></h2>${g.items
                      .map(
                        (m) =>
                          `<div class="it"><span class="nm">${esc(m.n)}</span><span class="dots"></span><span class="pr">${fa(m.p)}</span></div>`,
                      )
                      .join("")}</section>`,
                )
                .join("")}</div>`,
          )
          .join("");
      }

      /* بزرگ‌ترین فونتی که بدون سرریز جا شود */
      function bestFont(b) {
        const over = () =>
          [...b.children].some(
            (c) =>
              c.scrollHeight > c.clientHeight + 1 ||
              c.scrollWidth > c.clientWidth + 1,
          );
        let lo = 5, hi = 44;
        while (hi - lo > 0.2) {
          const mid = (lo + hi) / 2;
          b.style.setProperty("--fs", mid + "px");
          if (over()) hi = mid; else lo = mid;
        }
        return lo;
      }

      /* ---------- ریسپانسیو: بهترین تعداد ستون و اندازهٔ فونت برای هر صفحه ---------- */
      function fit() {
        const b = $("#board");
        let bestN = 1, bestFs = 0;
        for (let n = 1; n <= Math.min(6, GROUPS.length); n++) {
          build(n);
          const fs = bestFont(b);
          if (fs > bestFs + 0.05) { bestFs = fs; bestN = n; }
        }
        build(bestN);
        b.style.setProperty("--fs", bestFs * 0.95 + "px"); /* ۵٪ حاشیهٔ اطمینان */
      }

      let t;
      const refit = () => { clearTimeout(t); t = setTimeout(fit, 120); };
      addEventListener("resize", refit);
      if (window.ResizeObserver) new ResizeObserver(refit).observe(document.body);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      fit();
    </script>
  </body>
</html>
