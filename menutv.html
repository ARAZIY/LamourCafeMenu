<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>منوی کافه لامور</title>
    <link rel="apple-touch-icon" href="./logolamour.png" />
    <link rel="icon" type="image/png" href="./logolamour.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffecd1;
        --tx: #2b1d14;
        --mut: #8a7766;
        --pri: #8b5a2b;
        --pri2: #6f4520;
        --gold: #c27a10;
        --fs: 20px; /* توسط جاوااسکریپت تنظیم می‌شود */
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden; /* بدون اسکرول؛ همه‌چیز در یک صفحه */
      }
      body {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--tx);
        font-family: Vazirmatn, Tahoma, sans-serif;
        cursor: none;
      }

      /* ---------- بدنهٔ منو ---------- */
      #board {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        gap: 1.2vw;
        padding: 0.8vh 1.2vw 1.2vh;
        overflow: hidden;
        font-size: var(--fs);
      }
      .col {
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
      }
      .cat {
        margin-bottom: 0.7em;
      }
      .cat h2 {
        text-align: center;
        background: var(--pri2);
        color: #fff;
        font-size: 1em;
        font-weight: 800;
        padding: 0.25em 0.9em;
        border-radius: 100px;
        margin-bottom: 0.25em;
      }
      .it {
        break-inside: avoid;
        display: flex;
        align-items: baseline;
        gap: 0.5em;
        padding: 0.2em 0.3em;
        line-height: 1.35;
      }
      .it .nm {
        font-weight: 600;
        font-size: 0.95em;
        white-space: nowrap;
      }
      .it .dots {
        flex: 1;
        min-width: 1em;
        border-bottom: 1.5px dotted var(--mut);
        transform: translateY(-0.25em);
        opacity: 0.6;
      }
      .it .pr {
        font-weight: 800;
        color: var(--pri);
        font-size: 0.95em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>

    <main id="board"></main>

    <script>
      /* ---------- منو: فقط از همین لیست خوانده می‌شود (بدون دیتابیس) ---------- */
      const MENU = [
        { n: "سینگل", c: "قهوه", p: 140 },
        { n: "دبل", c: "قهوه", p: 160 },
        { n: "ترک", c: "قهوه", p: 160 },
        { n: "آمریکانو", c: "بار گرم", p: 180 },
        { n: "آیس آمریکانو", c: "بار سرد", p: 190 },
        { n: "لاته", c: "بار گرم", p: 210 },
        { n: "آیس لاته", c: "بار سرد", p: 230 },
        { n: "هات چاکلت", c: "بار گرم", p: 240 },
        { n: "موکا", c: "بار گرم", p: 230 },
        { n: "ماکیاتو", c: "بار گرم", p: 230 },
        { n: "آیس ماکیاتو", c: "بار سرد", p: 250 },
        { n: "چای ماسالا", c: "بار گرم", p: 230 },
        { n: "وایت چاکلت", c: "بار گرم", p: 240 },
        { n: "کاپوچینو", c: "بار گرم", p: 240 },
        { n: "آیس موکا", c: "بار سرد", p: 250 },
        { n: "آفوگاتو", c: "بار سرد", p: 360 },
        { n: "چای ویژه", c: "چایی", p: 250 },
        { n: "فنجانی", c: "چایی", p: 70 },
        { n: "دمنوش زنجبیل", c: "چایی", p: 250 },
        { n: "دمنوش لیمو نعناع", c: "چایی", p: 250 },
        { n: "سرماخوردگی", c: "چایی", p: 250 },
        { n: "گل گاوزبان", c: "چایی", p: 250 },
        { n: "دمنوش میوه", c: "چایی", p: 290 },
        { n: "شکلاتی", c: "شیک", p: 470 },
        { n: "نوتلا", c: "شیک", p: 470 },
        { n: "موز", c: "شیک", p: 420 },
        { n: "بادام زمینی", c: "شیک", p: 420 },
        { n: "نسکافه", c: "شیک", p: 400 },
        { n: "کیک خیس", c: "خوراکی", p: 250 },
        { n: "باقلوا", c: "خوراکی", p: 50 },
        { n: "آب", c: "نوشیدنی", p: 25 },
        { n: "آب آلبالو", c: "نوشیدنی", p: 120 },
        { n: "آبلوبری", c: "نوشیدنی", p: 120 },
        { n: "دراگون فروت", c: "نوشیدنی", p: 150 },
        { n: "آناناس", c: "نوشیدنی", p: 85 },
        { n: "شاهتوت سیاه", c: "نوشیدنی", p: 150 },
        { n: "هلو", c: "نوشیدنی", p: 85 },
        { n: "انرژی زا کوچک", c: "نوشیدنی", p: 130 },
        { n: "انرژی زا بزرگ", c: "نوشیدنی", p: 150 },
        { n: "لیموناد", c: "نوشیدنی", p: 85 },
        { n: "آب هویج", c: "بار موکتل", p: 200 },
        { n: "آب انار", c: "بار موکتل", p: 250 },
        { n: "آب سیب", c: "بار موکتل", p: 200 },
        { n: "آب پرتقال", c: "بار موکتل", p: 290 },
        { n: "شیر موز", c: "بار موکتل", p: 290 },
        { n: "آب طالبی", c: "بار موکتل", p: 290 },
        { n: "اسکوپ بستنی", c: "بار موکتل", p: 70 },
      ];

      const $ = (s) => document.querySelector(s);
      const fa = (n) => Number(n).toLocaleString("fa-IR");
      const esc = (s) => String(s == null ? "" : s).replace(/[<>&"]/g, "").trim();

      const GROUPS = (() => {
        const g = [];
        MENU.forEach((m) => {
          const c = esc(m.c);
          let x = g.find((y) => y.c == c);
          if (!x) g.push((x = { c, items: [] }));
          x.items.push(m);
        });
        return g;
      })();

      /* تقسیم دسته‌ها به n ستونِ پشت‌سرهم با کمترین اختلاف ارتفاع */
      function split(n) {
        const w = GROUPS.map((g) => g.items.length * 10 + 16);
        const cnt = (max) => {
          let c = 1, cur = 0;
          w.forEach((x) => {
            if (cur + x > max) { c++; cur = 0; }
            cur += x;
          });
          return c;
        };
        let lo = Math.max(...w), hi = w.reduce((a, b) => a + b, 0);
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (cnt(mid) <= n) hi = mid; else lo = mid + 1;
        }
        const cols = [[]];
        let cur = 0;
        GROUPS.forEach((g, i) => {
          if (cur + w[i] > lo && cols[cols.length - 1].length) {
            cols.push([]);
            cur = 0;
          }
          cols[cols.length - 1].push(g);
          cur += w[i];
        });
        return cols;
      }

      function build(n) {
        $("#board").innerHTML = split(n)
          .map(
            (col) =>
              `<div class="col">${col
                .map(
                  (g) =>
                    `<section class="cat"><h2>${g.c}</h2>${g.items
                      .map(
                        (m) =>
                          `<div class="it"><span class="nm">${esc(m.n)}</span><span class="dots"></span><span class="pr">${fa(m.p)}</span></div>`,
                      )
                      .join("")}</section>`,
                )
                .join("")}</div>`,
          )
          .join("");
      }

      /* بزرگ‌ترین فونتی که بدون سرریز جا شود */
      function bestFont(b) {
        const over = () =>
          [...b.children].some(
            (c) =>
              c.scrollHeight > c.clientHeight + 1 ||
              c.scrollWidth > c.clientWidth + 1,
          );
        let lo = 5, hi = 44;
        while (hi - lo > 0.2) {
          const mid = (lo + hi) / 2;
          b.style.setProperty("--fs", mid + "px");
          if (over()) hi = mid; else lo = mid;
        }
        return lo;
      }

      /* ---------- ریسپانسیو: بهترین تعداد ستون و اندازهٔ فونت برای هر صفحه ---------- */
      function fit() {
        const b = $("#board");
        let bestN = 1, bestFs = 0;
        for (let n = 1; n <= Math.min(6, GROUPS.length); n++) {
          build(n);
          const fs = bestFont(b);
          if (fs > bestFs + 0.05) { bestFs = fs; bestN = n; }
        }
        build(bestN);
        b.style.setProperty("--fs", bestFs * 0.95 + "px"); /* ۵٪ حاشیهٔ اطمینان */
      }

      let t;
      const refit = () => { clearTimeout(t); t = setTimeout(fit, 120); };
      addEventListener("resize", refit);
      if (window.ResizeObserver) new ResizeObserver(refit).observe(document.body);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      fit();
    </script>
  </body>
</html>
