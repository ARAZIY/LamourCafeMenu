<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>منوی کافه لامور</title>
    <link rel="apple-touch-icon" href="./logolamour.png" />
    <link rel="icon" type="image/png" href="./logolamour.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #ffecd1;
        --tx: #2b1d14;
        --mut: #8a7766;
        --pri: #8b5a2b;
        --pri2: #6f4520;
        --gold: #c27a10;
        --fs: 20px; /* توسط جاوااسکریپت تنظیم می‌شود */
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden; /* بدون اسکرول؛ همه‌چیز در یک صفحه */
      }
      body {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--tx);
        font-family: Vazirmatn, Tahoma, sans-serif;
        cursor: none;
      }

      /* ---------- هدر ---------- */
      header {
        flex: 0 0 auto;
        height: 11vh;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      header img {
        height: 82%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 100%;
        box-shadow: 0 0 20px 1px var(--gold);
      }

      /* ---------- بدنهٔ منو ---------- */
      #board {
        flex: 1 1 0;
        min-height: 0;
        padding: 1.2vh 1.2vw;
        overflow: hidden;
        font-size: var(--fs);
        column-count: var(--cols, 4);
        column-gap: 1.2vw;
        column-fill: balance;
      }
      .cat {
        margin-bottom: 0.7em;
      }
      .cat h2 {
        break-after: avoid;
        background: var(--pri2);
        color: #fff;
        font-size: 1em;
        font-weight: 800;
        padding: 0.25em 0.9em;
        border-radius: 100px;
        margin-bottom: 0.25em;
      }
      .it {
        break-inside: avoid;
        display: flex;
        align-items: baseline;
        gap: 0.5em;
        padding: 0.2em 0.3em;
        line-height: 1.35;
      }
      .it .nm {
        font-weight: 600;
        font-size: 0.95em;
        white-space: nowrap;
      }
      .it .dots {
        flex: 1;
        min-width: 1em;
        border-bottom: 1.5px dotted var(--mut);
        transform: translateY(-0.25em);
        opacity: 0.6;
      }
      .it .pr {
        font-weight: 800;
        color: var(--pri);
        font-size: 0.95em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="logolamour.png" alt="لوگو" />
    </header>

    <main id="board"></main>

    <script>
      /* ---------- منو: فقط از همین لیست خوانده می‌شود (بدون دیتابیس) ---------- */
      const MENU = [
        { n: "سینگل", c: "قهوه", p: 140 },
        { n: "دبل", c: "قهوه", p: 160 },
        { n: "ترک", c: "قهوه", p: 160 },
        { n: "آمریکانو", c: "گرم", p: 180 },
        { n: "آیس آمریکانو", c: "سرد", p: 190 },
        { n: "لاته", c: "گرم", p: 210 },
        { n: "آیس لاته", c: "سرد", p: 230 },
        { n: "هات چاکلت", c: "گرم", p: 240 },
        { n: "موکا", c: "گرم", p: 230 },
        { n: "ماکیاتو", c: "گرم", p: 230 },
        { n: "آیس ماکیاتو", c: "سرد", p: 250 },
        { n: "چای ماسالا", c: "گرم", p: 230 },
        { n: "وایت چاکلت", c: "گرم", p: 240 },
        { n: "کاپوچینو", c: "گرم", p: 240 },
        { n: "آیس موکا", c: "سرد", p: 250 },
        { n: "آفوگاتو", c: "سرد", p: 360 },
        { n: "چای ویژه", c: "چایی", p: 250 },
        { n: "فنجانی", c: "چایی", p: 70 },
        { n: "دمنوش زنجبیل", c: "چایی", p: 250 },
        { n: "دمنوش لیمو نعناع", c: "چایی", p: 250 },
        { n: "سرماخوردگی", c: "چایی", p: 250 },
        { n: "گل گاوزبان", c: "چایی", p: 250 },
        { n: "دمنوش میوه", c: "چایی", p: 290 },
        { n: "شکلاتی", c: "شیک", p: 470 },
        { n: "نوتلا", c: "شیک", p: 470 },
        { n: "موز", c: "شیک", p: 420 },
        { n: "بادام زمینی", c: "شیک", p: 420 },
        { n: "نسکافه", c: "شیک", p: 400 },
        { n: "کیک خیس", c: "خوراکی", p: 250 },
        { n: "باقلوا", c: "خوراکی", p: 50 },
        { n: "آب", c: "نوشیدنی", p: 25 },
        { n: "آلبالو", c: "نوشیدنی", p: 120 },
        { n: "بلوبری", c: "نوشیدنی", p: 120 },
        { n: "دراگون فروت", c: "نوشیدنی", p: 150 },
        { n: "آناناس", c: "نوشیدنی", p: 85 },
        { n: "شاهتوت سیاه", c: "نوشیدنی", p: 150 },
        { n: "هلو", c: "نوشیدنی", p: 85 },
        { n: "انرژی زا کوچک", c: "نوشیدنی", p: 130 },
        { n: "انرژی زا بزرگ", c: "نوشیدنی", p: 150 },
        { n: "لیموناد", c: "نوشیدنی", p: 85 },
        { n: "آب هویج", c: "موکتل", p: 200 },
        { n: "آب انار", c: "موکتل", p: 250 },
        { n: "آب سیب", c: "موکتل", p: 200 },
        { n: "آب پرتقال", c: "موکتل", p: 290 },
        { n: "شیر موز", c: "موکتل", p: 290 },
        { n: "آب طالبی", c: "موکتل", p: 290 },
        { n: "اسکوپ بستنی", c: "موکتل", p: 70 },
      ];

      const $ = (s) => document.querySelector(s);
      const fa = (n) => Number(n).toLocaleString("fa-IR");
      const esc = (s) => String(s == null ? "" : s).replace(/[<>&"]/g, "").trim();

      function render() {
        const cats = [];
        MENU.forEach((m) => {
          const c = esc(m.c);
          if (!cats.includes(c)) cats.push(c);
        });

        $("#board").innerHTML = cats
          .map(
            (c) =>
              `<section class="cat"><h2>${c}</h2>${MENU.filter(
                (m) => esc(m.c) == c,
              )
                .map(
                  (m) =>
                    `<div class="it"><span class="nm">${esc(m.n)}</span><span class="dots"></span><span class="pr">${fa(m.p)}</span></div>`,
                )
                .join("")}</section>`,
          )
          .join("");

        fit();
      }

      /* ---------- جاسازی خودکار: همهٔ آیتم‌ها در یک صفحه ---------- */
      function fit() {
        const b = $("#board");
        const ratio = innerWidth / innerHeight;
        b.style.setProperty("--cols", ratio >= 1.2 ? 4 : ratio >= 0.8 ? 3 : 2);
        const overflows = () =>
          b.scrollWidth > b.clientWidth + 2 ||
          b.scrollHeight > b.clientHeight + 2;
        let lo = 8,
          hi = 60,
          best = lo;
        while (hi - lo > 0.25) {
          const mid = (lo + hi) / 2;
          b.style.setProperty("--fs", mid + "px");
          if (overflows()) hi = mid;
          else {
            best = mid;
            lo = mid;
          }
        }
        b.style.setProperty("--fs", best + "px");
      }

      let t;
      addEventListener("resize", () => {
        clearTimeout(t);
        t = setTimeout(fit, 150);
      });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

      render();
    </script>
  </body>
</html>
