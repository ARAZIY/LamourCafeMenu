<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>منوی کافه لامور</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf5ee;
        --card: #fff;
        --tx: #2b1d14;
        --mut: #8a7766;
        --pri: #8b5a2b;
        --pri2: #6f4520;
        --bd: #e8dccb;
        --ok: #2e7d4f;
        --warn: #c27a10;
        --bad: #b3392f;
        --blue: #2b6cb0;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #675347;
          --card: #2a201a;
          --tx: #f3e9dc;
          --mut: #a8957f;
          --pri: #d19a5c;
          --pri2: #e6b27a;
          --bd: #43352b;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1c1511;
        --card: #2a201a;
        --tx: #f3e9dc;
        --mut: #a8957f;
        --pri: #d19a5c;
        --pri2: #e6b27a;
        --bd: #43352b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family: Vazirmatn, Tahoma, sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 10px;
        color: inherit;
        background: none;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--card);
        border-bottom: 1px solid var(--bd);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
      }
      header h1 {
        font-size: 1.1rem;
        font-weight: 800;
        flex: 1;
      }
      .tab {
        padding: 8px 14px;
        font-weight: 600;
        color: var(--mut);
        position: relative;
      }
      .tab.on {
        background: var(--pri);
        color: #fff;
      }
      .badge {
        position: absolute;
        top: -6px;
        left: -4px;
        background: var(--bad);
        color: #fff;
        border-radius: 99px;
        font-size: 0.7rem;
        min-width: 18px;
        height: 18px;
        line-height: 18px;
        text-align: center;
        padding: 0 4px;
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 14px;
      }
      .view {
        display: none;
      }
      .view.on {
        display: block;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 14px;
        align-items: start;
      }
      .cats {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 8px;
        margin-bottom: 6px;
      }
      .chip {
        white-space: nowrap;
        padding: 7px 13px;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 99px;
        font-size: 0.9rem;
      }
      .chip.on {
        background: var(--pri);
        color: #fff;
        border-color: var(--pri);
      }
      .menu {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }
      .item {
        display: grid;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 10px 8px;
        text-align: center;
        position: relative;
        justify-items: center;
        align-items: center;
        transition: transform 0.08s;
        cursor: pointer;
        user-select: none;
      }
      .item:active {
        transform: scale(0.96);
      }
      .ph,
      .th {
        width: 100%;
        height: 100%;
        border-radius: 10px;
        display: block;
      }
      .th {
        object-fit: cover;
      }
      .ph {
        background: var(--bg);
        border: 1px dashed var(--bd);
      }
      .item .n {
        font-weight: 600;
        margin: 6px 0 1px;
        font-size: 0.95rem;
      }
      .item .p {
        color: var(--mut);
        font-size: 0.82rem;
        margin-top: 3px;
      }
      .item .ds {
        color: var(--mut);
        font-size: 0.66rem;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .item .q {
        position: absolute;
        top: 6px;
        right: 6px;
        background: var(--pri);
        color: #fff;
        border-radius: 99px;
        min-width: 24px;
        height: 24px;
        line-height: 24px;
        font-size: 0.8rem;
        z-index: 1;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 14px;
        position: sticky;
        top: 70px;
      }
      .panel h2 {
        font-size: 1rem;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px dashed var(--bd);
      }
      .row .t {
        flex: 1;
        font-size: 0.92rem;
      }
      .qb {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .qb button {
        width: 28px;
        height: 28px;
        background: var(--bd);
        font-weight: 800;
      }
      input,
      textarea,
      select {
        font: inherit;
        width: 100%;
        padding: 9px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        background: var(--bg);
        color: var(--tx);
        margin-top: 8px;
      }
      .seg {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .seg button {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--bd);
      }
      .seg .on {
        background: var(--pri);
        color: #fff;
      }
      .tot {
        display: flex;
        justify-content: space-between;
        font-weight: 800;
        font-size: 1.1rem;
        margin: 12px 0;
      }
      .big {
        width: 100%;
        padding: 13px;
        background: var(--ok);
        color: #fff;
        font-weight: 800;
        font-size: 1rem;
      }
      .big:disabled {
        opacity: 0.4;
      }
      .mut {
        color: var(--mut);
        font-size: 0.88rem;
      }
      .eb {
        background: var(--warn);
        color: #fff;
        border-radius: 10px;
        padding: 8px 10px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
      }
      .eb button {
        background: #0003;
        padding: 4px 10px;
        color: #fff;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 1.15rem;
        color: var(--pri);
      }
      .orders {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 10px;
      }
      .oc {
        background: var(--card);
        border: 1px solid var(--bd);
        border-top: 5px solid var(--blue);
        border-radius: 14px;
        padding: 12px;
      }
      .oc.s1 {
        border-top-color: var(--warn);
      }
      .oc.s2 {
        border-top-color: var(--ok);
      }
      .oc.s3 {
        border-top-color: var(--mut);
        opacity: 0.7;
      }
      .oc .h {
        display: flex;
        justify-content: space-between;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .oc ul {
        list-style: none;
        padding: 0;
        font-size: 0.93rem;
      }
      .oc .note {
        background: var(--bg);
        border-radius: 8px;
        padding: 6px 8px;
        margin-top: 6px;
        font-size: 0.85rem;
      }
      .acts {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .acts .go {
        flex: 1;
        padding: 9px;
        background: var(--pri);
        color: #fff;
        font-weight: 600;
      }
      .acts .ed {
        padding: 9px 12px;
        background: var(--bd);
      }
      .acts .x {
        padding: 9px 12px;
        background: var(--bd);
        color: var(--bad);
      }
      .empty {
        text-align: center;
        color: var(--mut);
        padding: 40px 0;
      }
      .bar {
        display: none;
      }
      @media (max-width: 800px) {
        .grid2 {
          grid-template-columns: minmax(0, 1fr);
        }
        .grid2 > div {
          min-width: 0;
        }
        .panel {
          position: static;
        }
        .bar {
          display: flex;
          position: fixed;
          bottom: env(safe-area-inset-bottom, 0px);
          right: 12px;
          left: 12px;
          background: var(--pri);
          color: #fff;
          padding: 13px 16px;
          border-radius: 14px;
          justify-content: space-between;
          font-weight: 800;
          box-shadow: 0 4px 14px #0004;
        }
        #v1 {
          padding-bottom: 70px;
        }
        .tab span {
          display: none;
        }
        main,
        header {
          padding: 10px;
        }
        .menu {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .qb button {
          width: 36px;
          height: 36px;
        }
        .stat b {
          font-size: 0.95rem;
        }
        .stat .mut {
          font-size: 0.75rem;
        }
        .orders {
          grid-template-columns: minmax(0, 1fr);
        }
      }
          #v2, .tab { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1>به کافه لامور خوش اومدین</h1>
      <button class="tab on" data-v="v1">➕ <span>ثبت سفارش</span></button>
      <button class="tab" data-v="v2">
        📖 <span>سفارش‌ها</span><i class="badge" id="bd" hidden>0</i>
      </button>
    </header>
    <main>
      <section class="view on" id="v1">
        <div class="grid2">
          <div>
            <div class="cats" id="cats"></div>
            <div class="menu" id="menu"></div>
          </div>
          <div class="panel" id="panel">
            <div class="eb" id="eb" hidden>
              <span id="et"></span><button data-ce>لغو ویرایش</button>
            </div>
            <h2>سبد سفارش</h2>
            <div id="cart"></div>
            <div class="seg" id="typ">
              <button class="on" data-t="میز">🪑 سالن</button
              ><button data-t="بیرون‌بر">🛍️ بیرون‌بر</button>
            </div>
            <input
              id="tbl"
              type="text"
              inputmode="numeric"
              placeholder="شماره میز"
            />
            <textarea
              id="note"
              rows="2"
              placeholder="توضیحات (مثلاً بدون شکر)"
            ></textarea>
            <div class="tot"><span>جمع کل</span><span id="sum">۰</span></div>
            <button class="big" id="sub" disabled>ثبت سفارش ✓</button>
          </div>
        </div>
        <div
          class="bar"
          id="bar"
          onclick="
            document
              .getElementById('panel')
              .scrollIntoView({ behavior: 'smooth' })
          "
        >
          <span id="bc">۰ آیتم</span><span id="bs">۰</span>
        </div>
      </section>
      <section class="view" id="v2">
        <div class="stats">
          <div class="stat">
            <b id="s1">۰</b><span class="mut">سفارش امروز</span>
          </div>
          <div class="stat">
            <b id="s2">۰</b><span class="mut">در جریان</span>
          </div>
          <div class="stat">
            <b id="s3">۰</b><span class="mut">فروش (تومان)</span>
          </div>
        </div>
        <div class="cats" id="fl"></div>
        <div class="orders" id="ol"></div>
        <div style="margin-top: 16px; text-align: center">
          <button class="chip" id="clr">
            🗑️ پاک‌ کردن سفارش‌ های تحویل‌ داده شده
          </button>
        </div>
      </section>
    </main>
    <script>
      // برای هر آیتم، آدرس عکس را در فیلد i بنویس. مثال:
      // { n: "لاته", c: "گرم", p: 210, i: "images/latte.jpg" }
      const MENU = [
        { n: "سینگل", c: "قهوه", p: 140, i: "./single.jpg" },
        { n: "دبل", c: "قهوه", p: 160, i: "./dobbel.jpg" },
        { n: "ترک", c: "قهوه", p: 160, i: "./tork.jpg" },
        { n: "آمریکانو", c: "گرم", p: 180, i: "./americano.jpg" },
        { n: "آیس آمریکانو", c: "سرد", p: 190, i: "./ice americano.jpg" },
        { n: "لاته", c: "گرم", p: 210, i: "./late.jpg" },
        { n: "آیس لاته", c: "سرد", p: 230, i: "./ice latte.jpg" },
        { n: "هات چاکلت", c: "گرم", p: 240, i: "./hot choclet.jpg" },
        { n: "آلفردو", c: "غذا", p: 490, i: "" },
        { n: "پیتزا", c: "غذا", p: 600, i: "" },
        { n: "املت", c: "غذا", p: 270, i: "./omlet.jpg" },
        { n: "ایرانی", c: "غذا", p: 600, i: "" },
        { n: "نیمرو", c: "غذا", p: 200, i: "./nimroo.jpg" },
        { n: "سوسیس تخم مرغ", c: "غذا", p: 270, i: "./sosistokhmmorg.jpg" },
        { n: "قیساوا", c: "غذا", p: 270, i: "./geisava.jpg" },
        { n: "سجوک", c: "غذا", p: 290, i: "./sojoktokhmmorg.jpg" },
        { n: "موکا", c: "گرم", p: 230, i: "./moka.jpg" },
        { n: "ماکیاتو", c: "گرم", p: 230, i: "./machiato.jpg" },
        { n: "آیس ماکیاتو", c: "سرد", p: 250, i: "./machiato.jpg" },
        { n: "چای ماسالا", c: "گرم", p: 230, i: "./msala.jpg" },
        { n: "وایت چاکلت", c: "گرم", p: 240, i: "./white choclet.jpg" },
        { n: "کاپوچینو", c: "گرم", p: 240, i: "./capochino.jpg" },
        { n: "آیس موکا", c: "سرد", p: 250, i: "./ice moka.jpg" },
        { n: "آفوگاتو", c: "سرد", p: 360, i: "./afogato.png" },
        { n: "چای ویژه", c: "چایی", p: 250, i: "" },
        { n: "فنجانی", c: "چایی", p: 70, i: "./tea.jpg" },
        { n: "دمنوش زنجبیل", c: "چایی", p: 250, i: "./teaZanjabil.jpg" },
        { n: "دمنوش لیمو نعناع", c: "چایی", p: 250, i: "./teaLimonana.jpg" },
        { n: "سرماخوردگی", c: "چایی", p: 250, i: "./teaSarma.jpg" },
        { n: "گل گاوزبان", c: "چایی", p: 250, i: "./teaGawzaban.jpg" },
        { n: "دمنوش میوه", c: "چایی", p: 290, i: "./teaFruit.jpg" },
        { n: "شکلاتی", c: "شیک", p: 470, i: "./sheikChocolat.jpg" },
        { n: "نوتلا", c: "شیک", p: 470, i: "./sheikNotela.jpg" },
        { n: "موز", c: "شیک", p: 420, i: "./sheikMoz.jpg" },
        { n: "بادام زمینی", c: "شیک", p: 420, i: "./sheikBadam.jpg" },
        { n: "نسکافه", c: "شیک", p: 400, i: "./sheikNeskafe.jpg" },
        { n: "کیک خیس", c: "خوراکی", p: 250, i: "./cake.jpg" },
        { n: "باقلوا", c: "خوراکی", p: 50, i: "./baglava.jpg" },
        { n: "پستو", c: "غذا", p: 620, i: "" },
        { n: "مکن چیز", c: "غذا", p: 400, i: "" },
        { n: "باجیکا", c: "نوشیدنی", p: 0, i: "" },
        { n: "آب", c: "نوشیدنی", p: 25, i: "" },
      ].map((m, i) => ({ ...m, id: i }));
      const DESC = {
        لاته: "اسپرسو با شیر بخار‌داده و فوم نرم",
        کاپوچینو: "اسپرسو، شیر و فوم غلیظ به نسبت مساوی",
        آمریکانو: "اسپرسو رقیق‌شده با آب داغ",
        موکا: "اسپرسو، شکلات و شیر",
        آفوگاتو: "بستنی وانیلی با شات اسپرسو داغ",
        "چای ماسالا": "چای با شیر و ادویه‌های هندی",
        پیتزا: "پیتزای مخصوص با پنیر موزارلا",
        آلفردو: "پاستا با سس خامه و قارچ",
        املت: "تخم‌مرغ با گوجه و پیاز",
        "کیک خیس": "کیک شکلاتی نرم و خیس",
      };
      const CATS = ["همه", ...new Set(MENU.map((m) => m.c))];
      const ST = ["جدید", "در حال آماده‌سازی", "آماده تحویل", "تحویل شد"],
        NX = ["شروع آماده‌سازی", "آماده شد", "تحویل شد ✓"];
      // ⚠️ یوزرنیم تلگرام کافه را بدون @ بنویس. مثال: cafe_lamour
      const TELEGRAM = "lamour_cafe";
      const K = "cafe_orders_v1";
      let mem = [];
      const $ = (s) => document.querySelector(s),
        fa = (n) => Number(n).toLocaleString("fa-IR");
      const esc = (s) => String(s || "").replace(/[<>&"]/g, "");
      const load = () => {
        try {
          return JSON.parse(localStorage.getItem(K)) || [];
        } catch (e) {
          return mem;
        }
      };
      const save = (o) => {
        mem = o;
        try {
          localStorage.setItem(K, JSON.stringify(o));
        } catch (e) {}
      };
      const desc = (m) => DESC[m.n] ?? "";
      let cart = {},
        cat = "همه",
        typ = "میز",
        flt = -1,
        editing = null;

      function show(v) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.toggle("on", t.dataset.v == v));
        document
          .querySelectorAll(".view")
          .forEach((x) => x.classList.toggle("on", x.id == v));
        if (v == "v2") renderOrders();
      }
      function setTyp(t) {
        typ = t;
        document
          .querySelectorAll("#typ button")
          .forEach((x) => x.classList.toggle("on", x.dataset.t == t));
        $("#tbl").style.display = t == "میز" ? "" : "none";
      }
      function renderCats() {
        $("#cats").innerHTML = CATS.map(
          (c) =>
            `<button class="chip ${c == cat ? "on" : ""}" data-c="${c}">${c}</button>`,
        ).join("");
      }
      function renderMenu() {
        $("#menu").innerHTML = MENU.filter((m) => cat == "همه" || m.c == cat)
          .map(
            (m) =>
              `<div class="item" data-id="${m.id}">${cart[m.id] ? `<span class="q">${fa(cart[m.id])}</span>` : ""}${m.i ? `<img class="th" src="${encodeURI(m.i)}" alt="${m.n}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph'}))">` : `<div class="ph"></div>`}<div class="n">${m.n}</div>${desc(m) ? `<div class="ds">${esc(desc(m))}</div>` : ""}<div class="p">${fa(m.p)} تومان</div></div>`,
          )
          .join("");
      }
      function renderCart() {
        const ids = Object.keys(cart);
        let sum = 0,
          cnt = 0;
        $("#cart").innerHTML = ids.length
          ? ids
              .map((id) => {
                const m = MENU[id],
                  q = cart[id];
                sum += m.p * q;
                cnt += q;
                return `<div class="row"><span class="t">${m.n}<br><span class="mut">${fa(m.p * q)}</span></span><span class="qb"><button data-d="1" data-id="${id}">+</button><b>${fa(q)}</b><button data-d="-1" data-id="${id}">−</button></span></div>`;
              })
              .join("")
          : '<div class="empty">آیتمی انتخاب نشده</div>';
        $("#sum").textContent = fa(sum) + " تومان";
        $("#bs").textContent = fa(sum) + " تومان";
        $("#bc").textContent = fa(cnt) + " آیتم";
        $("#sub").disabled = !ids.length;
        $("#sub").textContent = editing ? "ذخیره تغییرات ✓" : "ثبت سفارش ✓";
        $("#eb").hidden = !editing;
        if (editing) {
          const o = load().find((r) => r.id == editing);
          $("#et").textContent = "✎ ویرایش سفارش #" + fa(o ? o.no : 0);
        }
        $("#bar").style.display =
          ids.length && innerWidth <= 800 ? "flex" : "none";
        renderMenu();
      }
      function renderOrders() {
        const all = load(),
          today = new Date().toDateString(),
          td = all.filter((o) => new Date(o.t).toDateString() == today);
        $("#s1").textContent = fa(td.length);
        $("#s2").textContent = fa(all.filter((o) => o.s < 3).length);
        $("#s3").textContent = fa(
          td.filter((o) => o.s == 3).reduce((a, o) => a + o.sum, 0),
        );
        const nw = all.filter((o) => o.s == 0).length;
        $("#bd").hidden = !nw;
        $("#bd").textContent = fa(nw);
        $("#fl").innerHTML = ["همه", ...ST]
          .map(
            (s, i) =>
              `<button class="chip ${flt == i - 1 ? "on" : ""}" data-f="${i - 1}">${s}</button>`,
          )
          .join("");
        const list = all
          .filter((o) => flt < 0 || o.s == flt)
          .sort((a, b) => (a.s == 3) - (b.s == 3) || a.t - b.t);
        $("#ol").innerHTML = list.length
          ? list
              .map(
                (o) =>
                  `<div class="oc s${o.s}"><div class="h"><span>#${fa(o.no)} · ${o.typ == "میز" ? "میز " + (esc(o.tbl) || "؟") : "بیرون‌بر"}</span><span class="mut">${new Date(o.t).toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" })}</span></div><ul>${o.items.map((i) => `<li>${fa(i.q)} × ${i.n}</li>`).join("")}</ul>${o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : ""}<div class="mut" style="margin-top:6px">${ST[o.s]} · ${fa(o.sum)} تومان</div><div class="acts">${o.s < 3 ? `<button class="go" data-adv="${o.id}">${NX[o.s]}</button>` : ""}<button class="ed" data-ed="${o.id}">✎</button><button class="x" data-del="${o.id}">✕</button></div></div>`,
              )
              .join("")
          : '<div class="empty" style="grid-column:1/-1">سفارشی وجود ندارد</div>';
      }
      function resetForm() {
        cart = {};
        editing = null;
        $("#tbl").value = "";
        $("#note").value = "";
        setTyp("میز");
      }
      document.addEventListener("click", (e) => {
        const it = e.target.closest(".item");
        if (it) {
          cart[it.dataset.id] = (cart[it.dataset.id] || 0) + 1;
          renderCart();
          return;
        }
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.v) show(b.dataset.v);
        else if (b.dataset.c) {
          cat = b.dataset.c;
          renderCats();
          renderMenu();
        } else if (b.dataset.d) {
          const id = b.dataset.id;
          cart[id] = (cart[id] || 0) + +b.dataset.d;
          if (cart[id] <= 0) delete cart[id];
          renderCart();
        } else if (b.dataset.t) setTyp(b.dataset.t);
        else if (b.dataset.f !== undefined) {
          flt = +b.dataset.f;
          renderOrders();
        } else if (b.dataset.adv) {
          const o = load(),
            x = o.find((r) => r.id == b.dataset.adv);
          if (x) x.s++;
          save(o);
          renderOrders();
        } else if (b.dataset.ed) {
          const x = load().find((r) => r.id == b.dataset.ed);
          if (!x) return;
          cart = {};
          x.items.forEach((i) => {
            const m =
              MENU.find((m) => m.id == i.id && m.n == i.n) ||
              MENU.find((m) => m.n == i.n);
            if (m) cart[m.id] = (cart[m.id] || 0) + i.q;
          });
          editing = x.id;
          setTyp(x.typ);
          $("#tbl").value = x.tbl || "";
          $("#note").value = x.note || "";
          show("v1");
          renderCart();
          scrollTo({ top: 0, behavior: "smooth" });
        } else if (b.dataset.ce !== undefined) {
          resetForm();
          renderCart();
        } else if (b.dataset.del) {
          if (confirm("این سفارش حذف شود؟")) {
            save(load().filter((r) => r.id != b.dataset.del));
            if (editing == b.dataset.del) {
              resetForm();
              renderCart();
            }
            renderOrders();
          }
        }
      });
      $("#sub").onclick = () => {
        const ids = Object.keys(cart);
        if (!ids.length) return;
        const tbl = $("#tbl").value.trim();
        if (typ == "میز" && !tbl) {
          alert("لطفاً شماره میز را وارد کنید");
          $("#tbl").focus();
          return;
        }
        let sum = 0;
        const lines = ids.map((id) => {
          const m = MENU[id], q = cart[id];
          sum += m.p * q;
          return "• " + q + " × " + m.n;
        });
        const note = $("#note").value.trim();
        const msg =
          "🧾 سفارش جدید\n" +
          (typ == "میز" ? "🪑 میز " + tbl : "🛍️ بیرون‌بر") + "\n\n" +
          lines.join("\n") +
          (note ? "\n\n📝 " + note : "") +
          "\n\n💰 جمع: " + sum + " تومان";
        resetForm();
        renderCart();
        try { navigator.clipboard.writeText(msg); } catch (e) {}
        const q = encodeURIComponent(msg);
        // اول مستقیم اپ تلگرام را باز می‌کند؛ اگر باز نشد، لینک معمولی
        location.href = "tg://resolve?domain=" + TELEGRAM + "&text=" + q;
        setTimeout(() => {
          if (!document.hidden)
            location.href = "https://t.me/" + TELEGRAM + "?text=" + q;
        }, 1500);
      };
      $("#clr").onclick = () => {
        if (confirm("همه سفارش‌های تحویل‌شده پاک شوند؟")) {
          save(load().filter((o) => o.s < 3));
          renderOrders();
        }
      };
      addEventListener("storage", (e) => {
        if (e.key == K) renderOrders();
      });
      setInterval(renderOrders, 30000);
      addEventListener("resize", renderCart);
      renderCats();
      renderCart();
      renderOrders();
    </script>
  </body>
</html>
